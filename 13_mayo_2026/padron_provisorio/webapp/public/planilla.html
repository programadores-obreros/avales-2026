<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#c49000">
<title>SUTEBA La Matanza 2026 — Planilla de Candidatos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #b8860b;
  --primary-dark: #8b6914;
  --primary-light: #fff8e1;
  --primary-50: #fffdf5;
  --success: #2e7d32;
  --success-light: #e8f5e9;
  --error: #c62828;
  --error-light: #ffebee;
  --surface: #ffffff;
  --bg: #f5f5f0;
  --border: #e2e0d8;
  --text: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.1);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07);
  --transition: .2s cubic-bezier(.4,0,.2,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 90px;
}
button { font-family: inherit; cursor: pointer; }

.header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
  padding: 16px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(139,105,20,.3);
}
.header h1 { font-size: 1.1rem; font-weight: 700; }
.header .subtitle { font-size: 0.75rem; opacity: 0.85; margin-top: 2px; }

.progress-wrap {
  background: var(--surface);
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 52px;
  z-index: 99;
}
.progress-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 3px;
  transition: width .3s ease;
  width: 0%;
}
.progress-text {
  font-size: 0.72rem;
  color: var(--text-secondary);
  margin-top: 4px;
  text-align: center;
}

.content { max-width: 600px; margin: 0 auto; padding: 12px; }

.lista-input {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.lista-input label {
  display: block;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.lista-input input {
  width: 100%;
  padding: 10px 14px;
  font-size: 1rem;
  font-family: inherit;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color var(--transition);
}
.lista-input input:focus { border-color: var(--primary); }

.section-card {
  background: var(--surface);
  border-radius: var(--radius);
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.section-header {
  display: flex;
  align-items: center;
  padding: 14px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  gap: 8px;
}
.section-header h2 {
  flex: 1;
  font-size: 0.9rem;
  font-weight: 700;
}
.section-count {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  background: var(--bg);
  padding: 3px 8px;
  border-radius: 12px;
}
.section-count.complete {
  background: var(--success-light);
  color: var(--success);
}
.section-chevron {
  width: 20px;
  height: 20px;
  color: var(--text-muted);
  transition: transform var(--transition);
}
.section-card.open .section-chevron { transform: rotate(180deg); }
.section-body {
  display: none;
  border-top: 1px solid var(--border);
}
.section-card.open .section-body { display: block; }

.sub-header {
  padding: 8px 14px;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--primary);
  background: var(--primary-50);
  border-bottom: 1px solid var(--border);
}

.slot {
  display: flex;
  align-items: center;
  padding: 8px 14px;
  border-bottom: 1px solid #f0efe8;
  cursor: pointer;
  gap: 10px;
  min-height: 44px;
  transition: background var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.slot:active { background: var(--primary-50); }
.slot:last-child { border-bottom: none; }
.slot-num {
  width: 24px;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-muted);
  text-align: center;
  flex-shrink: 0;
}
.slot-label {
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--primary-dark);
  min-width: 90px;
  flex-shrink: 0;
}
.slot-content { flex: 1; min-width: 0; }
.slot.empty .slot-content {
  color: var(--text-muted);
  font-size: 0.8rem;
  font-style: italic;
}
.slot.filled .slot-name {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.slot.filled .slot-school {
  font-size: 0.68rem;
  color: var(--text-secondary);
}
.slot-actions { display: flex; gap: 4px; flex-shrink: 0; }
.slot-remove, .slot-edit {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 50%;
  font-size: 1.1rem;
  line-height: 1;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.slot-remove {
  background: var(--error-light);
  color: var(--error);
}
.slot-edit {
  background: #ebf5fb;
  color: #2b6cb0;
  font-size: 0.85rem;
}
.slot-editing .slot-content { display: flex; flex-direction: column; gap: 4px; }
.slot-editing input {
  width: 100%;
  padding: 4px 6px;
  border: 1.5px solid var(--primary);
  border-radius: 4px;
  font-size: 0.8rem;
  font-family: inherit;
}
.slot-editing .edit-actions { display: flex; gap: 4px; margin-top: 2px; }
.slot-editing .edit-actions button {
  padding: 3px 10px;
  border: none;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
}
.slot-editing .btn-save-edit { background: var(--primary); color: #fff; }
.slot-editing .btn-cancel-edit { background: #e2e8f0; color: var(--text); }

.fab {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  border: none;
  border-radius: 28px;
  padding: 14px 24px;
  font-size: 0.9rem;
  font-weight: 700;
  box-shadow: 0 4px 12px rgba(139,105,20,.4);
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 90;
  transition: transform var(--transition), box-shadow var(--transition);
}
.fab:active { transform: scale(0.95); }
.fab svg { width: 20px; height: 20px; }

.fab-clear {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: var(--surface);
  color: var(--error);
  border: 2px solid var(--error);
  border-radius: 28px;
  padding: 10px 16px;
  font-size: 0.78rem;
  font-weight: 600;
  z-index: 90;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* MODAL */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 200;
}
.modal-overlay.active { display: flex; flex-direction: column; }
.modal {
  background: var(--surface);
  margin: auto;
  width: 100%;
  max-width: 500px;
  height: 85vh;
  border-radius: var(--radius) var(--radius) 0 0;
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-top {
  padding: 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.modal-top input {
  flex: 1;
  padding: 10px 14px;
  font-size: 1rem;
  font-family: inherit;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  outline: none;
}
.modal-top input:focus { border-color: var(--primary); }
.modal-close {
  width: 36px;
  height: 36px;
  border: none;
  background: var(--bg);
  border-radius: 50%;
  font-size: 1.3rem;
  color: var(--text-secondary);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-slot-info {
  padding: 8px 14px;
  font-size: 0.75rem;
  color: var(--primary-dark);
  background: var(--primary-light);
  font-weight: 600;
}
.modal-results {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.result-item {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  border-bottom: 1px solid #f0f0f0;
  cursor: pointer;
  gap: 10px;
  transition: background .15s;
}
.result-item:active { background: var(--primary-50); }
.result-item.assigned { opacity: 0.4; pointer-events: none; }
.result-name { font-size: 0.85rem; font-weight: 600; }
.result-meta { font-size: 0.72rem; color: var(--text-secondary); }
.result-badge {
  font-size: 0.65rem;
  background: var(--error-light);
  color: var(--error);
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 600;
}
.modal-empty {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-muted);
  font-size: 0.85rem;
}
.manual-toggle {
  display: block;
  text-align: center;
  padding: 10px;
  border-top: 1px solid #f0f0f0;
}
.manual-toggle button {
  padding: 8px 18px;
  border: 2px dashed var(--primary);
  border-radius: 8px;
  background: var(--primary-50, #fff8e1);
  color: var(--primary);
  font-weight: 700;
  font-size: 0.82rem;
  cursor: pointer;
}
.manual-toggle button:hover { background: var(--primary); color: #fff; }
.manual-form {
  padding: 12px 16px;
  border-top: 1px solid #f0f0f0;
  background: #fffbeb;
  display: none;
}
.manual-form.active { display: block; }
.manual-form label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 3px; }
.manual-form input {
  width: 100%; box-sizing: border-box;
  padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 6px;
  font-size: 0.85rem; margin-bottom: 8px;
}
.manual-form input:focus { border-color: var(--primary); outline: none; }
.manual-form button {
  width: 100%; padding: 8px; border: none; border-radius: 6px;
  background: var(--primary); color: #fff; font-weight: 600; font-size: 0.85rem;
  cursor: pointer;
}
.manual-form button:disabled { opacity: 0.5; cursor: not-allowed; }

/* PREVIEW MODAL */
.preview-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  z-index: 300;
  flex-direction: column;
}
.preview-overlay.active { display: flex; }
.preview-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--text);
  color: #fff;
}
.preview-bar h3 { font-size: 0.9rem; font-weight: 600; }
.preview-actions { display: flex; gap: 8px; }
.preview-actions button {
  padding: 8px 16px;
  border-radius: var(--radius-sm);
  font-size: 0.82rem;
  font-weight: 600;
  border: none;
  cursor: pointer;
}
.btn-download {
  background: var(--primary);
  color: #fff;
}
.btn-close-preview {
  background: rgba(255,255,255,.15);
  color: #fff;
}
.preview-frame {
  flex: 1;
  border: none;
  width: 100%;
  background: #525659;
}

.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text);
  color: #fff;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 0.82rem;
  z-index: 300;
  transition: transform .3s ease;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <h1>Planilla de Candidatos</h1>
  <div class="subtitle">SUTEBA La Matanza — Elecciones 13 de mayo 2026</div>
</div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="progress-text" id="progress-text">0 de 0 cargos asignados</div>
</div>

<div class="content">
  <div class="lista-input">
    <label>Nombre de la Lista</label>
    <input type="text" id="nombre-lista" placeholder="Ej: Lista Multicolor" autocomplete="off">
  </div>

  <div class="section-card open" id="sec-ce">
    <div class="section-header" onclick="toggleSection('ce')">
      <h2>Consejo Ejecutivo</h2>
      <span class="section-count" id="count-ce">0/22</span>
      <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="section-body" id="body-ce"></div>
  </div>

  <div class="section-card" id="sec-voc">
    <div class="section-header" onclick="toggleSection('voc')">
      <h2>Vocales</h2>
      <span class="section-count" id="count-voc">0/15</span>
      <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="section-body" id="body-voc"></div>
  </div>

  <div class="section-card" id="sec-cong">
    <div class="section-header" onclick="toggleSection('cong')">
      <h2>Congresales a SUTEBA</h2>
      <span class="section-count" id="count-cong">0/98</span>
      <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="section-body" id="body-cong"></div>
  </div>

  <div class="section-card" id="sec-com">
    <div class="section-header" onclick="toggleSection('com')">
      <h2>Comision Revisora de Cuentas</h2>
      <span class="section-count" id="count-com">0/6</span>
      <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="section-body" id="body-com"></div>
  </div>
</div>

<button class="fab" id="btn-export" onclick="previewPDF()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="20" height="20"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
  Vista previa
</button>

<button class="fab-clear" onclick="clearAll()">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
  Limpiar
</button>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-top">
      <input type="text" id="modal-search" placeholder="Buscar por nombre o DNI..." autocomplete="off">
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-slot-info" id="modal-slot-info"></div>
    <div class="modal-results" id="modal-results">
      <div class="modal-empty">Escribi al menos 2 caracteres para buscar</div>
    </div>
    <div class="manual-toggle"><button onclick="toggleManual()">✏ Cargar manualmente</button></div>
    <div class="manual-form" id="manual-form">
      <label>Nombre y Apellido</label>
      <input type="text" id="manual-nombre" placeholder="APELLIDO NOMBRE" autocomplete="off">
      <label>Escuela</label>
      <input type="text" id="manual-escuela" placeholder="Ej: 0-069-SS-0041" autocomplete="off">
      <button onclick="selectManual()" id="btn-manual">Asignar</button>
    </div>
  </div>
</div>

<div class="preview-overlay" id="preview-overlay">
  <div class="preview-bar">
    <h3>Vista previa PDF <span id="preview-badge" style="font-size:0.7rem;color:#e53e3e;font-weight:700;margin-left:6px;">BORRADOR</span></h3>
    <div class="preview-actions">
      <button class="btn-download" onclick="downloadFromPreview()" title="Descarga con marca BORRADOR">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="14" height="14" style="vertical-align:middle;margin-right:4px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Borrador
      </button>
      <button class="btn-download" style="background:#2f855a;" onclick="downloadFinal('completo')" title="PDF completo — anverso + reverso con firmas">
        Completo
      </button>
      <button class="btn-download" style="background:#2b6cb0;" onclick="downloadFinal('sin_firmas')" title="PDF sin tabla de firmas">
        Sin firmas
      </button>
      <button class="btn-download" style="background:#805ad5;" onclick="downloadFinal('solo_firmas')" title="PDF solo tabla de firmas — para reimprimir">
        Solo firmas
      </button>
      <button class="btn-close-preview" onclick="closePreview()">Cerrar</button>
    </div>
  </div>
  <iframe class="preview-frame" id="preview-frame"></iframe>
</div>

<div class="toast" id="toast"></div>

<script type="module">
// =====================================================================
// CONSTANTS
// =====================================================================
const SECRETARIAS = [
  'SEC. GRAL.', 'SEC. ADJUNTO', 'SEC. GREMIAL', 'SEC. ORGAN',
  'SEC. EDUCAC', 'SEC. SALUD LAB', 'SEC. ADM Y ACT', 'SEC. FINANZAS',
  'SEC. COMUNI', 'SEC. DD HH', 'SEC. GEN Y DIV', 'SEC. SER SYS',
  'SEC. PROM SYT', 'SEC POL C Y A', 'SEC. FORM P S', 'SEC. JUBILAC',
  'SUBS. GREMIAL', 'SUBS. GREMIAL', 'SUBS. ORG', 'SUBS. EDUCAC',
  'SUBS. SALUD', 'SUBS. DDHH'

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const fbApp = initializeApp({
  apiKey: "AIzaSyDeGyMnTg2ICElfv1YALmW5Ky9-VMEfqog",
  authDomain: "suteba-2026.firebaseapp.com",
  projectId: "suteba-2026",
  storageBucket: "suteba-2026.firebasestorage.app",
  messagingSenderId: "440127524100",
  appId: "1:440127524100:web:dbcf54bc66fb9897795451"
});
const db = getFirestore(fbApp);
const FIRESTORE_DOC = doc(db, 'planilla', 'estado');

// =====================================================================
// STATE
// =====================================================================
let DATA = [];
let state = loadState();
let currentSlot = null;

function defaultState() {
  return {
    nombreLista: '',
    ce: new Array(22).fill(null),
    vocTit: new Array(7).fill(null),
    vocSup: new Array(8).fill(null),
    congTit: new Array(49).fill(null),
    congSup: new Array(49).fill(null),
    comTit: new Array(3).fill(null),
    comSup: new Array(3).fill(null),
  };
}

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      const def = defaultState();
      for (const k in def) {
        if (!(k in parsed)) parsed[k] = def[k];
        if (Array.isArray(def[k]) && (!Array.isArray(parsed[k]) || parsed[k].length < def[k].length)) {
          const arr = def[k].slice();
          if (Array.isArray(parsed[k])) parsed[k].forEach((v, i) => { arr[i] = v; });
          parsed[k] = arr;
        }
      }
      return parsed;
    }
  } catch (e) { console.error('Error loading state:', e); }
  return defaultState();
}

var _saveTimer = null;
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  // Debounced save to Firestore (500ms)
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(function () {
    setDoc(FIRESTORE_DOC, JSON.parse(JSON.stringify(state)))
      .then(function () { console.log('Guardado en Firebase'); })
      .catch(function (e) { console.error('Error guardando en Firebase:', e); });
  }, 500);
}

function getAssignedDNIs() {
  const all = [
    ...state.ce, ...state.vocTit, ...state.vocSup,
    ...state.congTit, ...state.congSup, ...state.comTit, ...state.comSup
  ];
  return new Set(all.filter(Boolean).map(p => p.d));
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// Truncar escuela: "0-069-MS-0140" → "MS-0140", "JUBILADO/A" queda igual
function shortEsc(e) {
  if (!e) return '';
  return e.replace(/^\d-\d{3}-/, '');
}

// =====================================================================
// DATA LOADING
// =====================================================================
async function loadData() {
  try {
    // Try loading state from Firestore
    const snap = await getDoc(FIRESTORE_DOC);
    if (snap.exists()) {
      const remote = snap.data();
      const def = defaultState();
      // Merge remote with defaults (same logic as loadState)
      for (const k in def) {
        if (!(k in remote)) remote[k] = def[k];
        if (Array.isArray(def[k]) && (!Array.isArray(remote[k]) || remote[k].length < def[k].length)) {
          const arr = def[k].slice();
          if (Array.isArray(remote[k])) remote[k].forEach((v, i) => { arr[i] = v; });
          remote[k] = arr;
        }
      }
      state = remote;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      console.log('Estado cargado desde Firebase');
    }
  } catch (e) { console.warn('No se pudo cargar de Firebase, usando localStorage:', e); }
  try {
    const res = await fetch('data/padron_avales.json');
    DATA = await res.json();
    renderAll();
  } catch (e) {
    console.error('Error cargando padrón:', e);
    document.getElementById('progress-text').textContent = 'Error cargando datos';
  }
}

function toggleSection(id) {
  const card = document.getElementById('sec-' + id);

// =====================================================================
// SEARCH MODAL
// =====================================================================
function openSearch(section, index, label) {
  currentSlot = { section, index, label };
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.add('active');
  document.getElementById('modal-slot-info').textContent = 'Asignando: ' + label;
  const input = document.getElementById('modal-search');
  input.value = '';
  input.focus();
  renderResults();
}

function closeModal(event) {
  if (event && event.target !== document.getElementById('modal-overlay')) return;
  closeModalDirect();
}

function renderResults() {
  const q = (document.getElementById('modal-search').value || '').trim().toUpperCase();
  const container = document.getElementById('modal-results');

  if (q.length < 2) {
    container.innerHTML = '<div class="modal-empty">Escribi al menos 2 caracteres para buscar</div>';
    return;
  }

  const assigned = getAssignedDNIs();
  const results = [];
  for (const r of DATA) {
    if (results.length >= 30) break;
    if (r.d.startsWith(q) || r.n.toUpperCase().includes(q)) {
      results.push(r);
    }
  }

  if (!results.length) {
    container.innerHTML = '<div class="modal-empty">Sin resultados para "' + escapeHtml(q) + '"</div>';
    return;
  }

  let html = '';
  for (const r of results) {
    const isAssigned = assigned.has(r.d);
    html += '<div class="result-item' + (isAssigned ? ' assigned' : '') + '" ' +
      (isAssigned ? '' : 'onclick="selectPerson(\'' + r.d + '\')"') + '>' +
      '<div style="flex:1;min-width:0">' +
        '<div class="result-name">' + escapeHtml(r.n) + '</div>' +
        '<div class="result-meta">DNI ' + r.d + ' — ' + escapeHtml(shortEsc(r.e)) + '</div>' +
      '</div>' +
      (isAssigned ? '<span class="result-badge">Asignado</span>' : '') +
    '</div>';
  }
  container.innerHTML = html;
}

function selectPerson(dni) {
  if (!currentSlot) return;
  const person = DATA.find(r => r.d === dni);
  if (!person) return;
  state[currentSlot.section][currentSlot.index] = { d: person.d, n: person.n, e: person.e };
  saveState();
  closeModalDirect();
  renderAll();
}

function toggleManual() {
  document.getElementById('manual-form').classList.toggle('active');
  var nombre = document.getElementById('manual-nombre');
  if (document.getElementById('manual-form').classList.contains('active')) nombre.focus();
}

function selectManual() {
  if (!currentSlot) return;
  var nombre = document.getElementById('manual-nombre').value.trim().toUpperCase();
  var escuela = document.getElementById('manual-escuela').value.trim();
  if (!nombre) { document.getElementById('manual-nombre').focus(); return; }
  state[currentSlot.section][currentSlot.index] = { d: 'MANUAL', n: nombre, e: escuela || '' };
  saveState();
  closeModalDirect();
  renderAll();
  showToast('Cargado manualmente: ' + nombre);
}

function closeModalDirect() {
  document.getElementById('modal-overlay').classList.remove('active');
  document.getElementById('manual-form').classList.remove('active');
  document.getElementById('manual-nombre').value = '';
  document.getElementById('manual-escuela').value = '';
  currentSlot = null;
}

function removePerson(section, index) {
  event.stopPropagation();
  state[section][index] = null;
  saveState();
  renderAll();
}

function editPerson(section, index) {
  event.stopPropagation();
  const person = state[section][index];
  if (!person) return;
  const slots = document.querySelectorAll('.slot.filled');
  // Find the right slot by matching section + index via data attributes isn't available,
  // so we rebuild just that slot inline
  const allSlots = document.querySelectorAll('[onclick*="editPerson"]');
  // Simpler: find parent slot via the button that was clicked
  const btn = event.currentTarget;
  const slot = btn.closest('.slot');
  if (!slot || slot.classList.contains('slot-editing')) return;
  slot.classList.add('slot-editing');
  slot.removeAttribute('onclick');
  const content = slot.querySelector('.slot-content');
  content.innerHTML =
    '<input class="edit-name" value="' + escapeHtml(person.n) + '" placeholder="Nombre">' +
    '<input class="edit-school" value="' + escapeHtml(person.e) + '" placeholder="Escuela">' +
    '<div class="edit-actions">' +
      '<button class="btn-save-edit" onclick="saveEdit(\'' + section + '\',' + index + ')">Guardar</button>' +
      '<button class="btn-cancel-edit" onclick="cancelEdit()">Cancelar</button>' +
    '</div>';
  const nameInput = content.querySelector('.edit-name');
  nameInput.focus();
  nameInput.select();
  // Hide action buttons while editing
  const actions = slot.querySelector('.slot-actions');
  if (actions) actions.style.display = 'none';
}

function saveEdit(section, index) {
  event.stopPropagation();
  const slot = event.currentTarget.closest('.slot');
  const nombre = slot.querySelector('.edit-name').value.trim().toUpperCase();
  const escuela = slot.querySelector('.edit-school').value.trim();
  if (!nombre) { slot.querySelector('.edit-name').focus(); return; }
  state[section][index].n = nombre;
  state[section][index].e = escuela;
  saveState();
  renderAll();
  showToast('Editado: ' + nombre);
}

function cancelEdit() {
  event.stopPropagation();
  renderAll();
}

// =====================================================================
// RENDERING
// =====================================================================
function slotHtml(section, index, label, person) {
  const num = (index + 1).toString();
  const lblSafe = escapeHtml(label).replace(/'/g, "\\'");
  if (person) {
    return '<div class="slot filled" onclick="openSearch(\'' + section + '\',' + index + ',\'' + lblSafe + '\')">' +
      '<div class="slot-num">' + num + '</div>' +
      (label ? '<div class="slot-label">' + escapeHtml(label) + '</div>' : '') +
      '<div class="slot-content">' +
        '<div class="slot-name">' + escapeHtml(person.n) + '</div>' +
        '<div class="slot-school">' + escapeHtml(shortEsc(person.e)) + '</div>' +
      '</div>' +
      '<div class="slot-actions">' +
        '<button class="slot-edit" onclick="editPerson(\'' + section + '\',' + index + ')" title="Editar">&#9998;</button>' +
        '<button class="slot-remove" onclick="removePerson(\'' + section + '\',' + index + ')">×</button>' +
      '</div>' +
    '</div>';
  }
  return '<div class="slot empty" onclick="openSearch(\'' + section + '\',' + index + ',\'' + lblSafe + '\')">' +
    '<div class="slot-num">' + num + '</div>' +
    (label ? '<div class="slot-label">' + escapeHtml(label) + '</div>' : '') +
    '<div class="slot-content">Tocar para buscar</div>' +
  '</div>';
}

function renderCE() {
  let html = '';
  for (let i = 0; i < 22; i++) {
    html += slotHtml('ce', i, SECRETARIAS[i], state.ce[i]);
  }
  document.getElementById('body-ce').innerHTML = html;
  const filled = state.ce.filter(Boolean).length;
  const el = document.getElementById('count-ce');
  el.textContent = filled + '/22';
  el.className = 'section-count' + (filled === 22 ? ' complete' : '');
}

function renderPairedSection(bodyId, countId, titSection, supSection, titCount, supCount) {
  const total = titCount + supCount;
  let html = '<div class="sub-header">Titulares</div>';
  for (let i = 0; i < titCount; i++) {
    html += slotHtml(titSection, i, '', state[titSection][i]);
  }
  html += '<div class="sub-header">Suplentes</div>';
  for (let i = 0; i < supCount; i++) {
    html += slotHtml(supSection, i, '', state[supSection][i]);
  }
  document.getElementById(bodyId).innerHTML = html;
  const filled = state[titSection].filter(Boolean).length + state[supSection].filter(Boolean).length;
  const el = document.getElementById(countId);
  el.textContent = filled + '/' + total;
  el.className = 'section-count' + (filled === total ? ' complete' : '');
}

function renderAll() {
  document.getElementById('nombre-lista').value = state.nombreLista || '';
  renderCE();
  renderPairedSection('body-voc', 'count-voc', 'vocTit', 'vocSup', 7, 8);
  renderPairedSection('body-cong', 'count-cong', 'congTit', 'congSup', 49, 49);
  renderPairedSection('body-com', 'count-com', 'comTit', 'comSup', 3, 3);
  updateProgress();
}

function updateProgress() {
  const total = 22 + 7 + 8 + 49 + 49 + 3 + 3;
  const filled = [
    ...state.ce, ...state.vocTit, ...state.vocSup,
    ...state.congTit, ...state.congSup, ...state.comTit, ...state.comSup
  ].filter(Boolean).length;
  const pct = total ? (filled / total * 100).toFixed(1) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = filled + ' de ' + total + ' cargos asignados (' + Math.round(pct) + '%)';
}

// =====================================================================
// PDF GENERATION
// =====================================================================
function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector('script[src="' + src + '"]')) return resolve();
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}

async function ensurePdfLibs() {
  if (window.jspdf && window.jspdf.jsPDF) return;
  await loadScript('lib/jspdf.umd.min.js');
  await loadScript('lib/jspdf.plugin.autotable.min.js');
}

var lastPdfDoc = null;

// mode: 'completo' | 'sin_firmas' | 'solo_firmas'
async function buildPDF(opts) {
  opts = opts || {};
  var mode = opts.mode || 'completo';
  await ensurePdfLibs();
  const { jsPDF } = window.jspdf;
  // Oficio: 215.9 x 355.6 mm (8.5" x 14")
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [215.9, 355.6] });
  const W = 215.9, H = 355.6, ML = 7.1, MR = 4.7;
  const AW = W - ML - MR;
  generateAnverso(doc, W, H, ML, MR, AW, mode);
  doc.addPage();
  generateReverso(doc, W, H, ML, MR, AW, mode);
  if (opts.borrador !== false) drawWatermark(doc, W, H);
  return doc;
}

function drawWatermark(doc, W, H) {
  var totalPages = doc.internal.getNumberOfPages();
  for (var p = 1; p <= totalPages; p++) {
    doc.setPage(p);
    doc.saveGraphicsState();
    doc.setGState(new doc.GState({ opacity: 0.12 }));
    doc.setFontSize(90);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(255, 0, 0);
    doc.text('BORRADOR', W / 2, H / 2, { align: 'center', angle: 45 });
    doc.restoreGraphicsState();
  }
}

function getPdfFilename() {
  return 'planilla_candidatos_' + (state.nombreLista || 'LISTA').replace(/[^a-zA-Z0-9áéíóúñ]/gi, '_') + '.pdf';
}

async function previewPDF() {
  const btn = document.getElementById('btn-export');
  btn.disabled = true;
  btn.textContent = 'Generando...';

  try {
    lastPdfDoc = await buildPDF();
    var blobUrl = lastPdfDoc.output('bloburl');
    document.getElementById('preview-frame').src = blobUrl;
    document.getElementById('preview-overlay').classList.add('active');
  } catch (e) {
    console.error('Error generando PDF:', e);
    showToast('Error generando PDF');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="20" height="20"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Vista previa';
  }
}

function downloadFromPreview() {
  if (lastPdfDoc) {
    lastPdfDoc.save(getPdfFilename());
    showToast('PDF borrador descargado');
  }
}

async function downloadFinal(mode) {
  mode = mode || 'completo';
  var labels = { completo: 'completo', sin_firmas: 'sin_firmas', solo_firmas: 'solo_firmas' };
  try {
    var doc = await buildPDF({ borrador: false, mode: mode });
    var base = getPdfFilename().replace('.pdf', '');
    doc.save(base + '_' + (labels[mode] || mode) + '.pdf');
    showToast('PDF ' + mode + ' descargado');
  } catch (e) {
    console.error('Error generando PDF ' + mode + ':', e);
    showToast('Error generando PDF');
  }
}

function closePreview() {
  document.getElementById('preview-overlay').classList.remove('active');
  document.getElementById('preview-frame').src = '';
}

function drawHeaderImage(doc, W, ML, AW, y) {
  // Official header image (full width)
  var imgW = AW;
  var imgH = imgW * (159 / 781) - 3; // -3mm para ganar espacio
  try {
    doc.addImage(HEADER_B64, 'PNG', ML, y, imgW, imgH);
  } catch (e) { console.error('Error adding header image:', e); }
  y += imgH + 2;
  return y;
}

function drawHeader(doc, W, ML, AW, y) {
  y = drawHeaderImage(doc, W, ML, AW, y);
  y += 5; // separación header → texto avales

  // Avales text — Arial 12pt (del .doc metadata)
  // .doc indent: left=17.78mm right=4.07mm hanging=15.28mm → usamos margen extra derecho
  doc.setFontSize(12);
  doc.setTextColor(0);
  var listaName = state.nombreLista || '……………………………';
  var textW = AW - 4; // margen derecho extra del .doc (~4mm)

  // Build word array with bold flags
  var _words = [];
  'Lxs abajo firmantes, afiliadxs al SUTEBA, avalamos la presentación de la LISTA'.split(' ').forEach(function(w) {
    if (w) _words.push({ t: w, b: false });
  });
  listaName.split(' ').forEach(function(w) {
    if (w) _words.push({ t: w, b: true });
  });
  'en las próximas elecciones generales convocadas por la organización el próximo 13 de mayo de 2026.'.split(' ').forEach(function(w) {
    if (w) _words.push({ t: w, b: false });
  });

  // Pre-measure every word in its actual font
  doc.setFont('helvetica', 'normal');
  var _spW = doc.getTextWidth(' ');
  for (var i = 0; i < _words.length; i++) {
    doc.setFont('helvetica', _words[i].b ? 'bold' : 'normal');
    _words[i].w = doc.getTextWidth(_words[i].t);
  }

  // Line-breaking using real measured widths
  var _lines = [], _cur = [], _curW = 0;
  for (var i = 0; i < _words.length; i++) {
    var need = _cur.length > 0 ? _spW + _words[i].w : _words[i].w;
    if (_cur.length > 0 && _curW + need > textW) {
      _lines.push(_cur);
      _cur = [_words[i]]; _curW = _words[i].w;
    } else {
      _cur.push(_words[i]); _curW += need;
    }
  }
  if (_cur.length) _lines.push(_cur);

  // Render each line
  var lineH = 5;
  for (var li = 0; li < _lines.length; li++) {
    var ln = _lines[li], isLast = (li === _lines.length - 1);
    if (!isLast && ln.length > 1) {
      // Justified: gap = (AW - sum_of_words) / (n-1) → total always = AW
      var tw = 0;
      for (var j = 0; j < ln.length; j++) tw += ln[j].w;
      var gap = (textW - tw) / (ln.length - 1);
      var cx = ML;
      for (var j = 0; j < ln.length; j++) {
        doc.setFont('helvetica', ln[j].b ? 'bold' : 'normal');
        doc.text(ln[j].t, cx, y);
        cx += ln[j].w + gap;
      }
    } else {
      // Last line: left-aligned
      var cx = ML;
      for (var j = 0; j < ln.length; j++) {
        doc.setFont('helvetica', ln[j].b ? 'bold' : 'normal');
        doc.text(ln[j].t, cx, y);
        if (j < ln.length - 1) cx += ln[j].w + _spW;
      }
    }
    y += lineH;
  }
  y += 1;

  return y;
}

function drawSectionTitle(doc, W, y, text) {
  // Arial 11pt Bold Underline Center (from DOCX)
  doc.setFontSize(11);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(0);
  doc.text(text, W / 2, y, { align: 'center' });
  var tw = doc.getTextWidth(text);
  doc.setLineWidth(0.3);
  doc.setDrawColor(0);
  doc.line(W / 2 - tw / 2, y + 1, W / 2 + tw / 2, y + 1);
  return y + 4;
}

// ---- TABLE DEFAULTS (shared) ----
function getTableDefaults(ML, MR) {
  return {
    theme: 'grid',
    styles: {
      fontSize: 10,
      cellPadding: { top: 0.1, right: 1, bottom: 0.1, left: 1 },
      lineColor: [0, 0, 0],
      lineWidth: 0.25,
      textColor: [0, 0, 0],
      overflow: 'linebreak',
      font: 'helvetica',
    },
    headStyles: {
      fillColor: false,
      textColor: [0, 0, 0],
      fontStyle: 'bold',
      fontSize: 11,
      halign: 'center',
    },
    margin: { left: ML, right: MR },
  };
}

// Congresales: 47.6, 52.0, 52.0, 46.0 mm (del .doc metadata)
var congColStyles = {
  0: { cellWidth: 47.6 },
  1: { cellWidth: 52.0 },
  2: { cellWidth: 52.0 },
  3: { cellWidth: 46.0 },
};

function buildCongRow(i) {
  var tit = state.congTit[i];
  var sup = state.congSup[i];
  return [
    (i + 1) + (tit ? ' ' + tit.n : ''),
    tit ? shortEsc(tit.e) : '',
    (i + 1) + (sup ? ' ' + sup.n : ''),
    sup ? shortEsc(sup.e) : '',
  ];
}

// =====================================================================
// PAGINA 1 — ANVERSO
// =====================================================================
function generateAnverso(doc, W, H, ML, MR, AW, mode) {
  if (mode === 'solo_firmas') return;

  var y = 5;
  var td = getTableDefaults(ML, MR);
  var m = { left: ML, right: MR, bottom: 1.0 };

  // ---- HEADER + AVALES ----
  y = drawHeader(doc, W, ML, AW, y);

  // ---- CONSEJO EJECUTIVO ----
  // .doc: header 5.0mm, datos 4.4mm, cols: 29.0, 45.3, 23.9, 29.0, 47.7, 22.4
  var ceHead = [['SECRETARÍA', 'NOMBRE Y APELLIDO', 'ESCUELA', 'SECRETARÍA', 'NOMBRE Y APELLIDO', 'ESCUELA']];
  var ceBody = [];
  for (var i = 0; i < 11; i++) {
    var l = state.ce[i]; var r = state.ce[i + 11];
    ceBody.push([
      (i + 1) + ' ' + SECRETARIAS[i], l ? l.n : '', l ? shortEsc(l.e) : '',
      (i + 12) + ' ' + SECRETARIAS[i + 11], r ? r.n : '', r ? shortEsc(r.e) : '',
    ]);
  }
  doc.autoTable(Object.assign({}, td, {
    startY: y, head: ceHead, body: ceBody, margin: m,
    styles: Object.assign({}, td.styles, { fontSize: 9, valign: 'middle', minCellHeight: 4.1 }),
    headStyles: Object.assign({}, td.headStyles, { fontSize: 9.6, halign: 'center', valign: 'middle', minCellHeight: 4.1 }),
    columnStyles: {
      0: { cellWidth: 29.0, fontStyle: 'bold', fontSize: 8 },
      1: { cellWidth: 52.15 }, 2: { cellWidth: 17.5, fontSize: 8 },
      3: { cellWidth: 29.0, fontStyle: 'bold', fontSize: 8 },
      4: { cellWidth: 52.15 }, 5: { cellWidth: 17.5, fontSize: 8 },
    },
    didParseCell: function(data) {
      if (data.section === 'head' && (data.column.index === 2 || data.column.index === 5)) {
        data.cell.styles.fontSize = 8;
      }
    },
  }));
  y = doc.lastAutoTable.finalY + 5;

  // ---- VOCALES ----
  y = drawSectionTitle(doc, W, y, 'VOCALES');
  y += 1;
  var vocHead = [['TITULARES', 'ESCUELA', 'SUPLENTES', 'ESCUELA']];
  var vocBody = [];
  for (var i = 0; i < 8; i++) {
    var tit = i < 7 ? state.vocTit[i] : null; var sup = state.vocSup[i];
    vocBody.push([
      (i < 7 ? (i + 1) : '') + (tit ? ' ' + tit.n : ''), tit ? shortEsc(tit.e) : '',
      (i + 1) + (sup ? ' ' + sup.n : ''), sup ? shortEsc(sup.e) : '',
    ]);
  }
  // .doc: header 4.5mm, datos 4.8mm, cols: 47.2, 51.6, 51.5, 47.0
  // Titulares: 7 filas, Suplentes: 8 filas — fila 8 izquierda sin bordes
  doc.autoTable(Object.assign({}, td, {
    startY: y, head: vocHead, body: vocBody, margin: m,
    styles: Object.assign({}, td.styles, { fontSize: 12, font: 'times', minCellHeight: 4.1 }),
    headStyles: Object.assign({}, td.headStyles, { fontSize: 11, font: 'helvetica', minCellHeight: 4.1 }),
    columnStyles: {
      0: { cellWidth: 47.2 }, 1: { cellWidth: 51.6 },
      2: { cellWidth: 51.5 }, 3: { cellWidth: 47.0 },
    },
    didParseCell: function(data) {
      // Fila 8 (index 7) — ocultar celdas izquierdas (cols 0 y 1)
      if (data.section === 'body' && data.row.index === 7 && data.column.index <= 1) {
        data.cell.styles.lineWidth = 0;
        data.cell.styles.lineColor = [255, 255, 255];
      }
    },
  }));
  y = doc.lastAutoTable.finalY + 5;

  // ---- CONGRESALES A SUTEBA (1-29) ----
  y = drawSectionTitle(doc, W, y, 'CONGRESALES A SUTEBA');
  y += 1;
  var congHead = [['TITULARES', 'ESCUELA', 'SUPLENTES', 'ESCUELA']];
  var congBody1 = [];
  for (var i = 0; i < 29; i++) congBody1.push(buildCongRow(i));
  // Congresales: Times New Roman 12pt en oficial
  doc.autoTable(Object.assign({}, td, {
    startY: y, head: congHead, body: congBody1, margin: m,
    styles: Object.assign({}, td.styles, { fontSize: 12, font: 'times', minCellHeight: 4.1 }),
    headStyles: Object.assign({}, td.headStyles, { fontSize: 11, font: 'helvetica', minCellHeight: 4.1 }),
    columnStyles: congColStyles,
  }));
}

// =====================================================================
// PAGINA 2 — REVERSO
// =====================================================================
function generateReverso(doc, W, H, ML, MR, AW, mode) {
  var y = 5;
  var td = getTableDefaults(ML, MR);
  var m = { left: ML, right: MR, bottom: 1.0 };

  // solo_firmas: página 2 en blanco hasta ANCLA-R5
  // Posición medida del PDF completo generado: 195.6mm
  if (mode === 'solo_firmas') {
    y = 195.6;
  }

  if (mode !== 'solo_firmas') {
    // ---- HEADER (solo imagen, sin texto avales) ----
    y = drawHeaderImage(doc, W, ML, AW, y);

    // ---- CONGRESALES (30-49) — SIN header de tabla ----
    var congBody2 = [];
    for (var i = 29; i < 49; i++) congBody2.push(buildCongRow(i));
    doc.autoTable(Object.assign({}, td, {
      startY: y, body: congBody2, margin: m,
      styles: Object.assign({}, td.styles, { fontSize: 12, font: 'times', minCellHeight: 4.1 }),
      columnStyles: congColStyles,
    }));
    y = doc.lastAutoTable.finalY;

    // ---- ART. 53 (2 columnas como el oficial) ----
    doc.setFontSize(10);
    doc.setFont('times', 'normal');
    doc.setTextColor(0);
    doc.text('Art. 53 - Estatuto SUTEBA', ML, y + 3);
    doc.text('\u2022 Hasta 300 afiliadxs 2 (dos) congresales', ML, y + 6.5);
    doc.text('\u2022 De 301 en adelante, 1 (un) congresal más cada 200 afiliadxs', ML, y + 10);
    var rightX = ML + AW / 2 + 5;
    doc.text('\u2022 Se elegirán la misma cantidad de congresales', rightX, y + 6.5);
    doc.text('  suplentes como congresales titulares.', rightX, y + 10);
    y += 14;

    // ---- COMISIÓN REVISORA DE CUENTAS ----
    y += 5;
    y = drawSectionTitle(doc, W, y, 'COMISIÓN REVISORA DE CUENTAS');
    var comHead = [['TITULARES', 'ESCUELA', 'SUPLENTES', 'ESCUELA']];
    var comBody = [];
    for (var i = 0; i < 3; i++) {
      var tit = state.comTit[i]; var sup = state.comSup[i];
      comBody.push([
        (i + 1) + (tit ? ' ' + tit.n : ''), tit ? shortEsc(tit.e) : '',
        (i + 1) + (sup ? ' ' + sup.n : ''), sup ? shortEsc(sup.e) : '',
      ]);
    }
    // .doc: header 4.7mm, datos 4.4mm, cols: 46.1, 50.3, 50.4, 50.4
    doc.autoTable(Object.assign({}, td, {
      startY: y, head: comHead, body: comBody, margin: m,
      styles: Object.assign({}, td.styles, { fontSize: 11, minCellHeight: 4.1 }),
      headStyles: Object.assign({}, td.headStyles, { fontSize: 11, minCellHeight: 4.1 }),
      columnStyles: {
        0: { cellWidth: 46.1 }, 1: { cellWidth: 50.3 },
        2: { cellWidth: 50.4 }, 3: { cellWidth: 50.4 },
      },
    }));
    y = doc.lastAutoTable.finalY + 8;
  }

  // ---- TABLA DE FIRMAS (23 filas) ----
  if (mode !== 'sin_firmas') {
    var firmaHead = [['Nº', 'DOCUMENTO', 'APELLIDO/S Y NOMBRES', 'ESCUELA', 'FIRMA']];
    var firmaBody = [];
    for (var i = 0; i < 23; i++) firmaBody.push([(i + 1).toString(), '', '', '', '']);
    // Tabla firmas: 192mm centrada (margen simétrico)
    var firmaML = 13.2, firmaMR = 10.8;
    doc.autoTable(Object.assign({}, td, {
      startY: y, head: firmaHead, body: firmaBody,
      margin: { left: firmaML, right: firmaMR, bottom: 1.0 },
      styles: Object.assign({}, td.styles, { fontSize: 14, minCellHeight: 4.1 }),
      headStyles: Object.assign({}, td.headStyles, { fontSize: 14, minCellHeight: 4.1 }),
      columnStyles: {
        0: { cellWidth: 8.0, halign: 'center' },
        1: { cellWidth: 34.7 }, 2: { cellWidth: 83.1 },
        3: { cellWidth: 25.3 }, 4: { cellWidth: 40.9 },
      },
    }));
  }
}

document.getElementById('nombre-lista').addEventListener('input', function () {
  state.nombreLista = this.value;
  saveState();
});

var searchTimer;
document.getElementById('modal-search').addEventListener('input', function () {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderResults, 120);
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    document.getElementById('modal-overlay').classList.remove('active');
    currentSlot = null;
  }
});

Object.assign(window, {
  toggleSection, openSearch, closeModal, selectPerson, removePerson,
  editPerson, saveEdit, cancelEdit,
  toggleManual, selectManual, previewPDF, downloadFromPreview,
  downloadFinal, closePreview, clearAll
});
