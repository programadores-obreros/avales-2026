let sortKey = 'n';
let sortAsc = false;
let filtered = DATA.escuelas;

document.getElementById('c-padron').textContent = DATA.total_padron.toLocaleString();
document.getElementById('c-activos').textContent = DATA.total_activos.toLocaleString();
document.getElementById('c-jubilados').textContent = DATA.jubilados.toLocaleString();
document.getElementById('c-escuelas').textContent = DATA.total_escuelas.toLocaleString();

const maxN = DATA.escuelas[0]?.n || 1;

function render() {
  const tbody = document.getElementById('tbody');
  const info = document.getElementById('count-info');

  const totalShown = filtered.reduce((s, r) => s + r.n, 0);
  info.textContent = filtered.length + ' escuelas · ' + totalShown.toLocaleString() + ' afiliados';

  let html = '';
  for (let i = 0; i < filtered.length; i++) {
    const r = filtered[i];
    const barW = Math.round(r.n / maxN * 100);
    html += '<tr>' +
      '<td class="col-rank">' + (i + 1) + '</td>' +
      '<td class="col-esc">' + r.e.replace('0-069-', '') + '</td>' +
      '<td class="col-n">' + r.n + '</td>' +
      '<td class="col-pct">' + r.p.toFixed(2) + '%</td>' +
      '<td class="col-bar"><div class="bar-track"><div class="bar-fill" style="width:' + barW + '%"></div></div></td>' +
      '</tr>';
  }
  tbody.innerHTML = html;
}

// Search
document.getElementById('search').addEventListener('input', function() {
  const q = this.value.toUpperCase().trim();
  if (!q) {
    filtered = sortList(DATA.escuelas);
  } else {
    filtered = sortList(DATA.escuelas.filter(r => r.e.toUpperCase().includes(q)));
  }
  render();
});

// Sort
function sortList(arr) {
  const copy = [...arr];
  copy.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (typeof va === 'string') {
      return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    return sortAsc ? va - vb : vb - va;
  });
  return copy;
}

document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (sortKey === key) {
      sortAsc = !sortAsc;
    } else {
      sortKey = key;
      sortAsc = key === 'e'; // alphabetical asc by default
    }
    document.querySelectorAll('th').forEach(t => t.classList.remove('sorted'));
    th.classList.add('sorted');
    filtered = sortList(filtered);
    render();
  });
});

filtered = sortList(DATA.escuelas);
render();
