<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preparar Fotos - Padron SUTEBA 2026</title>
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
      --text: #e2e8f0; --text-muted: #94a3b8; --accent: #3b82f6;
      --green: #22c55e; --red: #ef4444; --yellow: #eab308;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: var(--surface); border-bottom: 1px solid var(--surface2); padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.1rem; } header h1 span { color: var(--accent); }
    .progress { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 1rem; }
    .progress strong { color: var(--green); }

    .main { display: flex; height: calc(100vh - 52px); }

    .sidebar { width: 180px; background: var(--surface); border-right: 1px solid var(--surface2); overflow-y: auto; flex-shrink: 0; }
    .sidebar-item { padding: 0.4rem 0.6rem; cursor: pointer; font-size: 0.75rem; border-bottom: 1px solid var(--surface2); display: flex; align-items: center; gap: 0.4rem; }
    .sidebar-item:hover { background: var(--surface2); }
    .sidebar-item.active { background: var(--accent); color: white; }
    .sidebar-item.done { border-left: 3px solid var(--green); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.pending { background: var(--text-muted); } .dot.done { background: var(--green); }

    .workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .toolbar { background: var(--surface); padding: 0.5rem 1rem; display: flex; gap: 0.5rem; align-items: center; border-bottom: 1px solid var(--surface2); flex-wrap: wrap; }
    .toolbar label { font-size: 0.8rem; color: var(--text-muted); }
    .btn { padding: 0.35rem 0.7rem; border: 1px solid var(--surface2); background: var(--surface2); color: var(--text); border-radius: 0.3rem; cursor: pointer; font-size: 0.8rem; }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn.success { background: var(--green); border-color: var(--green); color: white; }
    .btn.warn { background: var(--yellow); border-color: var(--yellow); color: #000; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .sep { color: var(--surface2); }

    .canvas-wrap { flex: 1; overflow: hidden; position: relative; background: #000; cursor: crosshair; }
    .canvas-wrap canvas { position: absolute; top: 0; left: 0; }

    .info-bar { background: var(--surface); padding: 0.4rem 1rem; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--surface2); display: flex; justify-content: space-between; }

    .page-input { background: var(--bg); border: 1px solid var(--surface2); color: var(--text); padding: 0.35rem 0.5rem; border-radius: 0.3rem; width: 55px; font-size: 0.9rem; text-align: center; }
    .page-input:focus { outline: none; border-color: var(--accent); }

    .drop-zone { position: absolute; inset: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; border: 2px dashed var(--surface2); border-radius: 1rem; color: var(--text-muted); font-size: 1.1rem; z-index: 10; background: var(--bg); }
    .load-btns { display: flex; gap: 1rem; }
    .btn-load { padding: 0.7rem 1.5rem; background: var(--accent); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 1rem; }
    .btn-load:hover { opacity: 0.9; }
    .btn-load.secondary { background: var(--surface2); color: var(--text); }
    .shortcut { display: inline-block; background: var(--surface2); padding: 0.1rem 0.4rem; border-radius: 0.2rem; font-size: 0.7rem; font-family: monospace; }
  </style>
</head>
<body>
  <header>
    <h1><span>SUTEBA 2026</span> | Preparar Fotos</h1>
    <div class="progress">
      Listas: <strong id="count-done">0</strong>/<span id="count-total">0</span>
      <button class="btn success" id="btn-export" onclick="exportar()" disabled>Exportar JSON</button>
    </div>
  </header>

  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="workspace">
      <div class="toolbar" id="toolbar" style="display:none">
        <label>Rotar:</label>
        <button class="btn" onclick="rotar(-90)"><span class="shortcut">&larr;</span> 90&deg;</button>
        <button class="btn" onclick="rotar(90)"><span class="shortcut">&rarr;</span> 90&deg;</button>
        <button class="btn" onclick="rotar(180)">180&deg;</button>
        <span class="sep">|</span>
        <label>Crop:</label>
        <button class="btn warn" onclick="resetCrop()">Reset crop</button>
        <span class="sep">|</span>
        <label>Pag:</label>
        <input type="number" class="page-input" id="page-num" min="1" max="300" placeholder="auto">
        <span class="sep">|</span>
        <button class="btn primary" onclick="guardarActual()"><span class="shortcut">S</span> Guardar</button>
        <button class="btn" onclick="siguiente()"><span class="shortcut">&darr;</span> Siguiente</button>
      </div>

      <div class="canvas-wrap" id="canvas-wrap">
        <div class="drop-zone" id="drop-zone">
          <div>Cargar fotos del padron</div>
          <div class="load-btns">
            <button class="btn-load" onclick="event.stopPropagation(); document.getElementById('folder-input').click()">Abrir carpeta</button>
            <button class="btn-load secondary" onclick="event.stopPropagation(); document.getElementById('files-input').click()">Seleccionar archivos</button>
          </div>
          <div style="font-size:0.8rem">Atajos: <span class="shortcut">&larr;&rarr;</span> rotar | <span class="shortcut">Enter</span> pagina | <span class="shortcut">S</span> guardar | <span class="shortcut">&darr;</span> siguiente</div>
        </div>
        <canvas id="canvas"></canvas>
      </div>

      <div class="info-bar" id="info-bar" style="display:none">
        <span id="info-file">-</span>
        <span id="info-crop">Crop: arrastra sobre la imagen</span>
        <span id="info-dims">-</span>
      </div>
    </div>
  </div>

  <input type="file" id="folder-input" webkitdirectory style="display:none" onchange="cargarArchivos(this.files)">
  <input type="file" id="files-input" multiple accept="image/*" style="display:none" onchange="cargarArchivos(this.files)">

  <script>
    let archivos = [], indiceActual = -1, rotacionActual = 0, imgActual = null, resultados = {};
    let cropStart = null, cropEnd = null, isCropping = false;
    let scale = 1, offsetX = 0, offsetY = 0;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const wrap = document.getElementById('canvas-wrap');

    function cargarArchivos(files) {
      archivos = Array.from(files)
        .filter(f => /\.(jpe?g|png)$/i.test(f.name))
        .sort((a, b) => a.name.localeCompare(b.name));

      document.getElementById('count-total').textContent = archivos.length;
      document.getElementById('drop-zone').style.display = 'none';
      document.getElementById('toolbar').style.display = 'flex';
      document.getElementById('info-bar').style.display = 'flex';

      renderSidebar();
      if (archivos.length > 0) seleccionar(0);
    }

    function renderSidebar() {
      document.getElementById('sidebar').innerHTML = archivos.map((f, i) => {
        const done = resultados[f.name] !== undefined;
        const short = f.name.replace('WhatsApp Image 2026-03-06 at ', '').replace('.jpeg', '').replace('.jpg', '');
        return `<div class="sidebar-item ${i === indiceActual ? 'active' : ''} ${done ? 'done' : ''}" onclick="seleccionar(${i})">
          <div class="dot ${done ? 'done' : 'pending'}"></div>
          <span>${done ? '&#10003; ' : ''}${short}</span>
        </div>`;
      }).join('');
    }

    function seleccionar(idx) {
      indiceActual = idx;
      rotacionActual = 0;
      cropStart = null; cropEnd = null;
      const file = archivos[idx];
      if (!file) return;

      if (resultados[file.name]) {
        rotacionActual = resultados[file.name].rotacion;
        document.getElementById('page-num').value = resultados[file.name].pagina;
        if (resultados[file.name].crop) {
          cropStart = resultados[file.name].crop[0];
          cropEnd = resultados[file.name].crop[1];
        }
      } else {
        document.getElementById('page-num').value = '';
      }

      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        imgActual = img;
        dibujar();
        document.getElementById('info-file').textContent = `[${idx+1}/${archivos.length}] ${file.name.replace('WhatsApp Image 2026-03-06 at ', '')}`;
      };
      img.src = url;
      renderSidebar();
    }

    function getRotatedSize() {
      if (!imgActual) return { w: 0, h: 0 };
      const r = rotacionActual % 360;
      if (r === 90 || r === 270) return { w: imgActual.height, h: imgActual.width };
      return { w: imgActual.width, h: imgActual.height };
    }

    function dibujar() {
      if (!imgActual) return;
      const wrapW = wrap.clientWidth, wrapH = wrap.clientHeight;
      const { w: imgW, h: imgH } = getRotatedSize();

      scale = Math.min(wrapW / imgW, wrapH / imgH, 1);
      const cw = Math.round(imgW * scale), ch = Math.round(imgH * scale);
      offsetX = Math.round((wrapW - cw) / 2);
      offsetY = Math.round((wrapH - ch) / 2);

      canvas.width = wrapW;
      canvas.height = wrapH;
      canvas.style.width = wrapW + 'px';
      canvas.style.height = wrapH + 'px';

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, wrapW, wrapH);

      ctx.save();
      ctx.translate(offsetX + cw / 2, offsetY + ch / 2);
      ctx.rotate((rotacionActual * Math.PI) / 180);
      ctx.drawImage(imgActual, -imgActual.width * scale / 2, -imgActual.height * scale / 2, imgActual.width * scale, imgActual.height * scale);
      ctx.restore();

      // Dibujar crop overlay
      if (cropStart && cropEnd) {
        const x1 = Math.min(cropStart.x, cropEnd.x), y1 = Math.min(cropStart.y, cropEnd.y);
        const x2 = Math.max(cropStart.x, cropEnd.x), y2 = Math.max(cropStart.y, cropEnd.y);

        // Oscurecer fuera del crop
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, wrapW, y1);           // arriba
        ctx.fillRect(0, y2, wrapW, wrapH - y2);  // abajo
        ctx.fillRect(0, y1, x1, y2 - y1);        // izquierda
        ctx.fillRect(x2, y1, wrapW - x2, y2 - y1); // derecha

        // Borde del crop
        ctx.strokeStyle = var_accent;
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 3]);
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
        ctx.setLineDash([]);

        // Dimensiones del crop en la imagen real
        const rw = Math.round((x2 - x1) / scale), rh = Math.round((y2 - y1) / scale);
        document.getElementById('info-crop').textContent = `Crop: ${rw}x${rh}px`;
      } else {
        document.getElementById('info-crop').textContent = 'Crop: arrastra sobre la imagen';
      }

      document.getElementById('info-dims').textContent = `${imgW}x${imgH} | rot: ${rotacionActual}°`;
    }

    const var_accent = '#3b82f6';

    // Mouse events para crop
    wrap.addEventListener('mousedown', (e) => {
      if (!imgActual) return;
      const rect = canvas.getBoundingClientRect();
      cropStart = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      cropEnd = null;
      isCropping = true;
    });

    wrap.addEventListener('mousemove', (e) => {
      if (!isCropping) return;
      const rect = canvas.getBoundingClientRect();
      cropEnd = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      dibujar();
    });

    wrap.addEventListener('mouseup', () => {
      if (!isCropping) return;
      isCropping = false;
      // Si el crop es muy chico, ignorar (fue un click, no un drag)
      if (cropStart && cropEnd) {
        const w = Math.abs(cropEnd.x - cropStart.x);
        const h = Math.abs(cropEnd.y - cropStart.y);
        if (w < 20 || h < 20) { cropStart = null; cropEnd = null; dibujar(); }
      }
    });

    function resetCrop() { cropStart = null; cropEnd = null; dibujar(); }

    function rotar(deg) { rotacionActual = (rotacionActual + deg + 360) % 360; dibujar(); }

    function getCropInImageCoords() {
      if (!cropStart || !cropEnd) return null;
      const x1 = Math.round((Math.min(cropStart.x, cropEnd.x) - offsetX) / scale);
      const y1 = Math.round((Math.min(cropStart.y, cropEnd.y) - offsetY) / scale);
      const x2 = Math.round((Math.max(cropStart.x, cropEnd.x) - offsetX) / scale);
      const y2 = Math.round((Math.max(cropStart.y, cropEnd.y) - offsetY) / scale);
      return { x: Math.max(0, x1), y: Math.max(0, y1), w: x2 - x1, h: y2 - y1 };
    }

    function guardarActual() {
      const file = archivos[indiceActual];
      const raw = document.getElementById('page-num').value.trim();
      const pagina = raw ? parseInt(raw) : 0;  // 0 = auto-detectar con IA

      if (raw && (pagina < 1 || pagina > 300)) {
        document.getElementById('page-num').style.borderColor = 'var(--red)';
        document.getElementById('page-num').focus();
        return;
      }
      document.getElementById('page-num').style.borderColor = '';

      if (pagina > 0) {
        for (const [name, data] of Object.entries(resultados)) {
          if (data.pagina === pagina && name !== file.name) {
            alert(`Pagina ${pagina} ya asignada a otra foto`);
            return;
          }
        }
      }

      const cropCoords = getCropInImageCoords();

      resultados[file.name] = {
        rotacion: rotacionActual,
        pagina: pagina,
        crop: cropStart && cropEnd ? [cropStart, cropEnd] : null,
        cropImg: cropCoords,
      };

      const done = Object.keys(resultados).length;
      document.getElementById('count-done').textContent = done;
      document.getElementById('btn-export').disabled = false;

      renderSidebar();
      siguiente();
    }

    function siguiente() {
      for (let i = indiceActual + 1; i < archivos.length; i++) {
        if (!resultados[archivos[i].name]) { seleccionar(i); return; }
      }
      if (indiceActual < archivos.length - 1) seleccionar(indiceActual + 1);
    }

    function exportar() {
      const data = {};
      for (const [name, info] of Object.entries(resultados)) {
        data[name] = { rotacion: info.rotacion, pagina: info.pagina, crop: info.cropImg };
      }
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'fotos_preparadas.json';
      a.click();
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') {
        if (e.key === 'Escape') e.target.blur();
        return;
      }
      switch(e.key) {
        case 'ArrowLeft': rotar(-90); break;
        case 'ArrowRight': rotar(90); break;
        case 'ArrowDown': e.preventDefault(); siguiente(); break;
        case 'Enter': document.getElementById('page-num').focus(); break;
        case 's': case 'S': e.preventDefault(); guardarActual(); break;
        case 'r': case 'R': resetCrop(); break;
      }
    });

    window.addEventListener('resize', () => { if (imgActual) dibujar(); });
  </script>
</body>
</html>
